---
name: Weekly

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ahead:
    name: On Python ${{ matrix.python }}, newest tools
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install the newest tools, unpinned on purpose
        run: |
          python -m pip install --disable-pip-version-check \
            --upgrade ruff mypy coverage setuptools types-setuptools

      - name: Formatting, as the newest formatter sees it
        run: ruff format --check .

      - name: Lint, with whatever rules were added since
        run: ruff check --output-format=github .

      - name: Types, as the newest checker sees them
        run: mypy

      - name: Bring down the die netlist, so the die tests run rather than skip
        run: |
          python - <<'FETCH'
          import json, subprocess
          from pathlib import Path
          held = json.loads(Path("conformance/netlist.manifest.json").read_text())
          where = Path("docs/independent/visual6502")
          where.mkdir(parents=True, exist_ok=True)
          for entry in held["netlist"]:
              subprocess.run(
                  [
                      "curl",
                      "-sSL",
                      "--fail",
                      "-o",
                      str(where / entry["file"]),
                      entry["retrievedFrom"],
                  ],
                  check=True,
                  timeout=120,
              )
          FETCH
        shell: bash

      - name: Every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find z80 conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must still be total
        run: python -m coverage report

      - name: Timing against the manufacturer's own figures
        run: |
          status=0
          for file in conformance/hardware*.test.py; do
            python "${file}" || status=1
          done
          exit "${status}"
        shell: bash
