name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON and YAML file is formatted
        run: pnpm run format:check

      # The workflows are the one thing here nothing else checks, and a mistake
      # in them is only visible once a run has already gone wrong. The archive
      # is verified by digest before anything in it runs, for the same reason
      # every document this project reads is.
      - name: Check the workflows themselves
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh

  types:
    name: Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker
        run: pipx install mypy==1.14.1

      # Strict, with every optional error class the version offers turned on. A
      # model of a processor is arithmetic on masked integers end to end, and a
      # checker that sees the whole register file is the cheapest place to catch
      # a width or a None crossing a boundary it should not. The settings live in
      # pyproject.toml so a local run and this one agree.
      - name: Every annotation has to hold
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage
        run: python -m pip install --disable-pip-version-check coverage==7.6.10

      # The netlist is somebody else's work, so this repository carries its
      # identity and never the files, and the die tests skip when it is absent.
      # A check that only ever skips reports success by not running, so it is
      # fetched here from the commit netlist.json pins. The loader refuses
      # anything whose digest is not the one that was read, which makes a moved
      # file fail here rather than be simulated as though it were the part.
      - name: Bring down the die netlist
        run: |
          python - <<'FETCH'
          import json, subprocess
          from pathlib import Path
          held = json.loads(Path("conformance/netlist.json").read_text())
          where = Path("docs/independent/visual6502")
          where.mkdir(parents=True, exist_ok=True)
          for entry in held["files"]:
              subprocess.run(
                  ["curl", "-sSL", "--fail", "-o", str(where / entry["file"]), entry["retrievedFrom"]],
                  check=True,
                  timeout=120,
              )
          FETCH
        shell: bash

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find z80 conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

      # Uninstrumented, and deliberately after the coverage run. This is the one
      # check that holds the core to Zilog rather than to a recording, and it
      # needs no corpus, so a machine with no network still runs it.
      - name: Every timing the manual prints, against a run of the instruction
        run: python -m conformance.timing

      # No document is redistributable, so none is here and this checks nothing
      # on a runner. It says so rather than reporting a pass: the value is that
      # somebody running it with the documents on disk gets a real answer, and
      # that a run without them cannot be mistaken for one.
      - name: Every quoted sentence, against the document it came from
        run: python -m conformance.quotes

      # Uninstrumented, and deliberately after the coverage run rather than
      # inside it. A coverage tracer costs about ten times what the model does, so
      # a throughput check under one measures the tracer.
      - name: The model has not become several times slower
        run: python -m conformance.speed

  conformance:
    name: Conformance against the published suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read the pinned suite commit
        id: pin
        run: |
          commit=$(python -c "import json,pathlib;print(json.loads(pathlib.Path('conformance/suites.json').read_text())['suites'][0]['commit'])")
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache the suite
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/conformance-suites
          key: suites-${{ steps.pin.outputs.commit }}

      - name: Fetch the suite
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m conformance.fetch ~/.cache/conformance-suites

      # A pull request runs a tenth of the suite for a quick answer. A push to
      # main runs all one thousand cases per opcode across all sixteen hundred
      # files, because that is the number the claim of conformance rests on.
      - name: Run the suite
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            limit=100
          else
            limit=0
          fi
          if [ "${limit}" = "0" ]; then
            python -m conformance.singlestep ~/.cache/conformance-suites/z80/v1
          else
            python -m conformance.singlestep ~/.cache/conformance-suites/z80/v1 --limit "${limit}"
          fi
        shell: bash

  cycles:
    name: Cycle by cycle against the published suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read the pinned suite commit
        id: pin
        run: |
          commit=$(python -c "import json,pathlib;print(json.loads(pathlib.Path('conformance/suites.json').read_text())['suites'][0]['commit'])")
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache the suite
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/conformance-suites
          key: suites-${{ steps.pin.outputs.commit }}

      - name: Fetch the suite
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m conformance.fetch ~/.cache/conformance-suites

      # The state comparison beside this one asks what an instruction left
      # behind. This asks what the part did while producing it: the address, the
      # value and which control pins were asserted, for every T state. A core can
      # spend the right number of cycles doing the wrong thing, and only this
      # notices.
      - name: Compare every T state
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            python -m conformance.cycles ~/.cache/conformance-suites/z80/v1 --limit 100
          else
            python -m conformance.cycles ~/.cache/conformance-suites/z80/v1
          fi
        shell: bash
