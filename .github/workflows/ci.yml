---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every file Prettier reads is formatted
        run: pnpm run format:check

      - name: Check the workflows, with actionlint verified by digest
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

      - name: Lint every YAML file
        run: |
          pipx install yamllint==1.38.0
          yamllint --strict .

      - name: Lint the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck --severity=style --shell=bash scripts/*.sh

  types:
    name: Types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker and the build backend's stubs
        run: |
          pipx install mypy==1.14.1
          pipx inject mypy types-setuptools==84.0.0.20260812

      - name: Every annotation has to hold
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage and the build backend its tests drive
        run: |
          python -m pip install --disable-pip-version-check \
            coverage==7.6.10 setuptools==84.0.0

      - name: Bring down the die netlist, so the die tests run rather than skip
        run: |
          python - <<'FETCH'
          import json, subprocess
          from pathlib import Path
          held = json.loads(Path("conformance/netlist.manifest.json").read_text())
          where = Path("docs/independent/visual6502")
          where.mkdir(parents=True, exist_ok=True)
          for entry in held["netlist"]:
              subprocess.run(
                  [
                      "curl",
                      "-sSL",
                      "--fail",
                      "-o",
                      str(where / entry["file"]),
                      entry["retrievedFrom"],
                  ],
                  check=True,
                  timeout=120,
              )
          FETCH
        shell: bash

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find z80 conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

      - name: Run every exerciser image present, exit 2 meaning none is
        run: |
          status=0
          python -m conformance.exercisers || status="$?"
          other=0
          python -m conformance.cputype || other="$?"
          if [ "${status}" -eq 2 ] && [ "${other}" -ne 2 ]; then
            status="${other}"
          elif [ "${status}" -eq 0 ] && [ "${other}" -eq 1 ]; then
            status="${other}"
          fi
          if [ "${status}" -eq 2 ]; then
            notice="No exerciser image is present on a hosted runner,"
            notice="${notice} so this run was skipped rather than passed."
            notice="${notice} The recorded verdicts are still held by their tests."
            notice="${notice} Run it locally, or point TEST_CARTRIDGES at a folder or zip you own."
            echo "::notice title=Test cartridges::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash

      - name: Every timing the manual prints, against a run of the instruction
        run: python -m conformance.timing

      - name: Every quoted sentence, against the document it came from, where present
        run: python -m conformance.quotes

      - name: The model has not become several times slower, outside coverage
        run: python -m conformance.speed

  conformance:
    name: Conformance against the published suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read the pinned suite commit
        id: pin
        run: |
          commit=$(python - <<'PY'
          import json
          import pathlib
          held = json.loads(pathlib.Path("conformance/suites.json").read_text())
          print(held["suites"][0]["commit"])
          PY
          )
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache the suite
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/conformance-suites
          key: suites-${{ steps.pin.outputs.commit }}

      - name: Fetch the suite
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m conformance.fetch ~/.cache/conformance-suites

      - name: Run the suite, a tenth of it on a pull request
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            limit=100
          else
            limit=0
          fi
          if [ "${limit}" = "0" ]; then
            python -m conformance.singlestep ~/.cache/conformance-suites/z80/v1
          else
            python -m conformance.singlestep ~/.cache/conformance-suites/z80/v1 --limit "${limit}"
          fi
        shell: bash

  cycles:
    name: Cycle by cycle against the published suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Read the pinned suite commit
        id: pin
        run: |
          commit=$(python - <<'PY'
          import json
          import pathlib
          held = json.loads(pathlib.Path("conformance/suites.json").read_text())
          print(held["suites"][0]["commit"])
          PY
          )
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - name: Cache the suite
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/conformance-suites
          key: suites-${{ steps.pin.outputs.commit }}

      - name: Fetch the suite
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -m conformance.fetch ~/.cache/conformance-suites

      - name: Compare every T state
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            python -m conformance.cycles ~/.cache/conformance-suites/z80/v1 --limit 100
          else
            python -m conformance.cycles ~/.cache/conformance-suites/z80/v1
          fi
        shell: bash

  package:
    name: package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Every module ships and no test does
        run: python -m conformance.package dist/z80-*.whl
