---
name: Suite watch

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: suite-watch
  cancel-in-progress: false

jobs:
  revalidate:
    name: Re-validate against the newest suite
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Ask upstream where it is now
        id: upstream
        run: |
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import json, os, pathlib, sys
          sys.path.insert(0, "conformance")
          import fetch

          suite = fetch.definitions()[0]
          latest = fetch.latest_commit(suite)
          print(f"pinned={suite['commit']}")
          print(f"latest={latest or ''}")
          print(f"moved={str(bool(latest) and latest != suite['commit']).lower()}")
          PY

      - name: Nothing to do
        if: steps.upstream.outputs.latest == ''
        run: |
          echo "::warning::upstream could not be reached; leaving the pin alone"
          exit 0

      - name: Fetch the newer suite
        if: steps.upstream.outputs.moved == 'true'
        env:
          LATEST: ${{ steps.upstream.outputs.latest }}
        run: |
          python - "${LATEST}" <<'PY'
          import pathlib, sys
          sys.path.insert(0, "conformance")
          import fetch

          suite = fetch.definitions()[0]
          where = fetch.fetch(suite, pathlib.Path.home() / ".cache" / "suite", sys.argv[1])
          print(where)
          PY

      - name: Run the whole suite
        if: steps.upstream.outputs.moved == 'true'
        id: run
        continue-on-error: true
        run: |
          set -o pipefail
          python -m conformance.singlestep ~/.cache/suite/z80/v1 \
            | tee /tmp/report.txt

      - name: Propose the bump
        if: steps.upstream.outputs.moved == 'true' && steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          PINNED: ${{ steps.upstream.outputs.pinned }}
        run: |
          branch="suite/${LATEST:0:12}"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "already proposed"
            exit 0
          fi
          python - <<'PY'
          import json, os, pathlib

          path = pathlib.Path("conformance/suites.json")
          text = path.read_text()
          path.write_text(text.replace(os.environ["PINNED"], os.environ["LATEST"]))
          PY
          git switch -c "${branch}"
          git add conformance/suites.json
          git commit -m "test: move the Z80 suite pin to ${LATEST:0:12}"
          git push -u origin "${branch}"
          {
            cat .github/suite-moved.md
            printf '\nWas %s, now %s.\n\n' "\`${PINNED}\`" "\`${LATEST}\`"
            cat /tmp/report.txt
          } > /tmp/pr.md
          gh pr create \
            --title "test: move the Z80 suite pin to ${LATEST:0:12}" \
            --body-file /tmp/pr.md

      - name: Report the disagreement
        if: steps.upstream.outputs.moved == 'true' && steps.run.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST: ${{ steps.upstream.outputs.latest }}
          PINNED: ${{ steps.upstream.outputs.pinned }}
        run: |
          title="Conformance fails against suite ${LATEST:0:12}"
          open=$(gh issue list --search "${title} in:title" \
            --state open --json number --jq '.[].number')
          if [ -n "${open}" ]; then
            echo "already reported"
            exit 0
          fi
          {
            cat .github/suite-failed.md
            printf '\nPinned %s, tried %s.\n\n' "\`${PINNED}\`" "\`${LATEST}\`"
            cat /tmp/report.txt
          } > /tmp/issue.md
          gh issue create --title "${title}" --body-file /tmp/issue.md
